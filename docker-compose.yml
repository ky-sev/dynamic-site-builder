services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflows}
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_workflow_versions.sql:/docker-entrypoint-initdb.d/001_workflow_versions.sql:ro
      - ./backend/migrations/002_form_submissions.sql:/docker-entrypoint-initdb.d/002_form_submissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./frontend/env.local
    environment:
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-workflows}
      PGUSER: ${POSTGRES_USER:-workflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-compose-only}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "4000"
      WORKFLOW_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"

volumes:
  postgres_data:
